{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4">Reset your password</h2>
      <p class="text-muted">Enter your account email and we'll send reset instructions.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Send reset link</button>
      </form>
    </div>
  </div>
{% endblock %}
