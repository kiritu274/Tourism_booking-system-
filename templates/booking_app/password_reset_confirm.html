{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h2 class="mb-4">Set a new password</h2>
      {% if validlink %}
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Set new password</button>
        </form>
      {% else %}
        <div class="alert alert-danger">This password reset link is invalid or has expired.</div>
      {% endif %}
    </div>
  </div>
{% endblock %}
